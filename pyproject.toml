[project]
name = "oss-pipeline"
version = "0.1.0"
description = "Semi-automated OSS contribution pipeline for the vimalyad identity"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
pipeline = "oss_pipeline.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
